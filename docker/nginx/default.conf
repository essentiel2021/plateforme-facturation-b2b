server {
    # 1. Écoute sur le port 80 en IPv4 et en IPv6
    # (indispensable sous Windows pour que localhost réponde instantanément)
    listen 80;
    listen [::]:80;
    server_name localhost;

    # 2. Le point d'entrée unique de Laravel est public/
    root /var/www/html/public;
    index index.php index.html;

    # 3. Sécurité : masquer la version de Nginx pour ne pas aider les attaquants
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    charset utf-8;

    # 4. Rediriger toutes les URLs vers index.php (le routeur de Laravel)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # 5. Transmettre l'exécution du code PHP au conteneur 'app' sur le port 9000
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Buffers pour les réponses volumineuses (ex: listes de 500 factures)
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # 6. Sécurité absolue : bloquer l'accès direct aux fichiers .env, .git, etc.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
